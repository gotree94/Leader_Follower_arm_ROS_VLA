# MoveIt2 Configuration
moveit:
  ros__parameters:
    robot_description: "ur5e"
    kinematics_solver: "kdl_kinematics_plugin/KDLKinematicsPlugin"
    kinematics_solver_search_resolution: 0.005
    kinematics_solver_timeout: 0.05
    kinematics_solver_attempts: 3
    planning_pipelines: ["ompl"]
    ompl:
      planner_configs: ["RRTConnect", "RRTstar"]
      RRTConnect: {type: "geometric::RRTConnect", range: 0.5}
      RRTstar: {type: "geometric::RRTstar", range: 0.5}
    collision_checking:
      collision_activation_distance: 0.1
      collision_checking_type: "geometric"
      padding: 0.01
    servo:
      command_in_type: "velocity_commands"
      command_out_type: "trajectory_msgs/JointTrajectory"
      scale: {linear: 0.3, rotational: 0.3, joint: 1.0}
      collision_check_rate: 10.0
      self_collision_proximity_threshold: 0.01
      scene_collision_proximity_threshold: 0.02
      low_pass_filter_coeff: 0.5
