# cosmos_config.yaml
cosmos:
  reason:
    model: "cosmos-reason-v2"
    api_endpoint: "https://api.nvidia.com/v1/cosmos"
    temperature: 0.1
    max_tokens: 2048
  
  policy:
    model: "nvidia/cosmos-predict2-2b"
    device: "cuda"
    dtype: "bfloat16"
  
  transfer:
    model: "cosmos-transfer-v2"
    output_resolution: [640, 480]
